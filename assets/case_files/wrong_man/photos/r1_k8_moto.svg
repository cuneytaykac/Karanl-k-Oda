<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400" xmlns:c2pa="http://c2pa.org/manifest"><!-- Yanlış Adam · Rulo 1 · Kare 8 · "Kırmızı motosiklet"
       İçeriden, camdan çekilmiş: Cem kırmızı motosikletine biniyor. İçerideki duvar saati 10:40.
       İnceleme 1: duvar saati, merkez (62, 78), yarıçap 28 → zaman: 10:40
       İnceleme 2: kırmızı motosiklet, merkez (178, 292), yarıçap 44 → ipucu -->
  <defs>
    <linearGradient id="street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9B593"/>
      <stop offset="1" stop-color="#A89676"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.48" r="0.75">
      <stop offset="0.55" stop-color="#1C1714" stop-opacity="0"/>
      <stop offset="1" stop-color="#1C1714" stop-opacity="0.8"/>
    </radialGradient>
  </defs>

  <!-- içerideki koyu duvar (çerçeve) -->
  <rect width="300" height="400" fill="#4A3B2E"/>
  <!-- duvar saati 10:40 -->
  <circle cx="62" cy="78" r="22" fill="#EFE5D2" stroke="#2A1F17" stroke-width="4"/>
  <g stroke="#6E655B" stroke-width="1"><path d="M62 58 V62 M82 78 H78 M62 98 V94 M42 78 H46"/></g>
  <path d="M62 78 L54.9 69.6" stroke="#1C1714" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M62 78 L46.8 86.8" stroke="#1C1714" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="62" cy="78" r="1.8" fill="#A8362A"/>

  <!-- vitrin camı: sokak -->
  <rect x="104" y="40" width="182" height="320" fill="url(#street)"/>
  <rect x="104" y="40" width="182" height="320" fill="none" stroke="#2A221B" stroke-width="6"/>
  <path d="M195 40 V360" stroke="#2A221B" stroke-width="4"/>
  <rect x="104" y="230" width="182" height="130" fill="#8E7C60"/>
  <!-- karşı bina -->
  <rect x="112" y="60" width="74" height="150" fill="#B8A585"/>
  <rect x="204" y="70" width="74" height="140" fill="#AE9B7B"/>
  <g fill="#6E5E47"><rect x="124" y="80" width="18" height="26"/><rect x="156" y="80" width="18" height="26"/><rect x="216" y="90" width="18" height="26"/><rect x="248" y="90" width="18" height="26"/></g>

  <!-- KIRMIZI MOTOSİKLET (soluk renkli film) -->
  <g>
    <circle cx="136" cy="318" r="22" fill="none" stroke="#1C1714" stroke-width="6"/>
    <circle cx="226" cy="318" r="22" fill="none" stroke="#1C1714" stroke-width="6"/>
    <circle cx="136" cy="318" r="4" fill="#6E655B"/>
    <circle cx="226" cy="318" r="4" fill="#6E655B"/>
    <path d="M136 318 L166 288 H204 L226 318" fill="none" stroke="#3A2F24" stroke-width="4"/>
    <path d="M150 284 C156 266 196 264 206 282 L198 296 H160 Z" fill="#A8473A"/>
    <rect x="160" y="276" width="34" height="8" rx="3" fill="#2A221B"/>
    <path d="M210 278 L222 262" stroke="#2A221B" stroke-width="3" stroke-linecap="round"/>
    <path d="M218 260 H230" stroke="#2A221B" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Cem: kask elinde, motora biniyor (arkadan) -->
  <path d="M168 280 C166 248 170 222 182 214 C196 222 200 248 198 280 Z" fill="#4A5248"/>
  <circle cx="183" cy="200" r="13" fill="#2E261F"/>
  <path d="M196 236 L214 248" stroke="#4A5248" stroke-width="8" stroke-linecap="round"/>
  <circle cx="218" cy="250" r="9" fill="#C9B593" stroke="#2A221B" stroke-width="2"/>

  <rect width="300" height="400" fill="#8A5A2B" opacity="0.06"/>
  <rect width="300" height="400" fill="url(#vignette)"/>
  <text x="282" y="392" text-anchor="end" font-family="JetBrainsMono" font-size="13" font-weight="700" fill="#E8893A" opacity="0.92">'89 3 3</text>
</svg>
