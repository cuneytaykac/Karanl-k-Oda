<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400" xmlns:c2pa="http://c2pa.org/manifest"><!-- Yanlış Adam · Rulo 1 · Kare 2 · "Duvar saatleri"
       Bütün saatler aynı anı gösteriyor: 4:10. Necati'nin saatleri hep doğru.
       İnceleme: büyük sarkaçlı saat, merkez (150, 165), yarıçap 34 → ipucu -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8C7A5E"/>
      <stop offset="1" stop-color="#6E5E47"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#F3E7CC" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F3E7CC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.48" r="0.75">
      <stop offset="0.55" stop-color="#1C1714" stop-opacity="0"/>
      <stop offset="1" stop-color="#1C1714" stop-opacity="0.8"/>
    </radialGradient>
  </defs>

  <rect width="300" height="400" fill="url(#wall)"/>
  <rect width="300" height="400" fill="url(#lamp)"/>
  <!-- duvar kağıdı çizgileri -->
  <g stroke="#7A6A50" stroke-width="1" opacity="0.4">
    <path d="M25 0 V400 M75 0 V400 M125 0 V400 M175 0 V400 M225 0 V400 M275 0 V400"/>
  </g>

  <!-- Küçük duvar saatleri: hepsi 4:10 -->
  <g>
    <circle cx="48" cy="58" r="20" fill="#E9DFC9" stroke="#3B3128" stroke-width="3"/>
    <path d="M48 58 L56.2 63.7 M48 58 L61.9 50" stroke="#1C1714" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="252" cy="60" r="22" fill="#E2D6BC" stroke="#5A4A3A" stroke-width="4"/>
    <path d="M252 60 L261 66.3 M252 60 L267.2 51.2" stroke="#1C1714" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="30" y="250" width="44" height="44" rx="4" fill="#E9DFC9" stroke="#3B3128" stroke-width="3"/>
    <path d="M52 272 L60.2 277.7 M52 272 L65.9 264" stroke="#1C1714" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="254" cy="268" r="18" fill="#E9DFC9" stroke="#2E261F" stroke-width="3"/>
    <path d="M254 268 L261.4 273.2 M254 268 L266.5 260.8" stroke="#1C1714" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="60" cy="160" r="14" fill="#DCCFB4" stroke="#4A3B2E" stroke-width="3"/>
    <path d="M60 160 L65.7 164 M60 160 L69.7 154.4" stroke="#1C1714" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="242" cy="164" r="15" fill="#DCCFB4" stroke="#4A3B2E" stroke-width="3"/>
    <path d="M242 164 L248.1 168.3 M242 164 L252.4 158" stroke="#1C1714" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- Büyük sarkaçlı saat -->
  <rect x="104" y="112" width="92" height="250" rx="10" fill="#4A3426"/>
  <rect x="112" y="122" width="76" height="84" rx="6" fill="#5E4330"/>
  <circle cx="150" cy="165" r="30" fill="#EFE5D2" stroke="#2A1F17" stroke-width="3"/>
  <g stroke="#6E655B" stroke-width="1">
    <path d="M150 137 V141 M178 165 H174 M150 193 V189 M122 165 H126"/>
  </g>
  <!-- akrep 4, yelkovan 2 (4:10) -->
  <path d="M150 165 L162.3 173.6" stroke="#1C1714" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M150 165 L170.8 153" stroke="#1C1714" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="150" cy="165" r="2" fill="#A8362A"/>
  <!-- sarkaç camı -->
  <rect x="122" y="220" width="56" height="126" rx="4" fill="#2E241C"/>
  <path d="M150 222 L142 318" stroke="#C9A34E" stroke-width="1.6"/>
  <circle cx="142" cy="322" r="11" fill="#C9A34E"/>
  <circle cx="139" cy="319" r="3" fill="#F3E7CC" opacity="0.6"/>

  <rect width="300" height="400" fill="#8A5A2B" opacity="0.08"/>
  <rect width="300" height="400" fill="url(#vignette)"/>
  <text x="282" y="392" text-anchor="end" font-family="JetBrainsMono" font-size="13" font-weight="700" fill="#E8893A" opacity="0.92">'89 2 24</text>
</svg>
