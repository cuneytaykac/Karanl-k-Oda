<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Yanlış Adam · Rulo 1 · Kare 7 · "3 Mart, sabah"
       Kapı yeni açılmış, sabah ışığı yere düşüyor. Duvar saati 9:00.
       İnceleme: duvar saati, merkez (80, 110), yarıçap 30 → zaman: 09:00 -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7E6C52"/>
      <stop offset="1" stop-color="#5E4E3A"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3E7CC" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F3E7CC" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.48" r="0.75">
      <stop offset="0.55" stop-color="#1C1714" stop-opacity="0"/>
      <stop offset="1" stop-color="#1C1714" stop-opacity="0.8"/>
    </radialGradient>
  </defs>

  <rect width="300" height="400" fill="url(#wall)"/>
  <!-- zemin -->
  <path d="M0 300 H300 V400 H0 Z" fill="#4A3B2E"/>
  <g stroke="#3B2F24" stroke-width="1"><path d="M0 330 H300 M0 364 H300"/></g>

  <!-- açık kapı (sağda) -->
  <rect x="176" y="70" width="104" height="230" fill="#E6D7B6"/>
  <path d="M176 70 L150 82 V310 L176 300 Z" fill="#3A2F24"/>
  <rect x="153" y="180" width="6" height="10" rx="2" fill="#C9A34E"/>
  <!-- dışarıda sokak -->
  <rect x="176" y="230" width="104" height="70" fill="#B8A585"/>
  <rect x="190" y="110" width="30" height="80" fill="#C9B593"/>
  <rect x="232" y="96" width="40" height="94" fill="#BCA887"/>
  <!-- içeri düşen ışık -->
  <path d="M176 300 L280 300 L200 400 L40 400 Z" fill="url(#beam)"/>

  <!-- tezgâh -->
  <rect x="0" y="236" width="140" height="80" fill="#5A442F"/>
  <rect x="0" y="230" width="146" height="10" fill="#6E5A44"/>
  <circle cx="40" cy="222" r="9" fill="#E9DFC9" stroke="#6E655B" stroke-width="2"/>

  <!-- duvar saati 9:00 -->
  <circle cx="80" cy="110" r="26" fill="#EFE5D2" stroke="#2A1F17" stroke-width="4"/>
  <g stroke="#6E655B" stroke-width="1.2">
    <path d="M80 87 V91 M103 110 H99 M80 133 V129 M57 110 H61"/>
  </g>
  <path d="M80 110 L68 110" stroke="#1C1714" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M80 110 L80 90.8" stroke="#1C1714" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="80" cy="110" r="2" fill="#A8362A"/>

  <rect width="300" height="400" fill="#8A5A2B" opacity="0.08"/>
  <rect width="300" height="400" fill="url(#vignette)"/>
  <text x="282" y="392" text-anchor="end" font-family="JetBrainsMono" font-size="13" font-weight="700" fill="#E8893A" opacity="0.92">'89 3 3</text>
</svg>
