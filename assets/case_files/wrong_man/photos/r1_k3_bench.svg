<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400" xmlns:c2pa="http://c2pa.org/manifest"><!-- Yanlış Adam · Rulo 1 · Kare 3 · "Tezgâh"
       Söküklü kol saatleri, saatçi büyüteci, köşede fotoğraf makinesi.
       İnceleme: fotoğraf makinesi, merkez (222, 300), yarıçap 36 → ipucu -->
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A5F43"/>
      <stop offset="1" stop-color="#5A442F"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.45" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#F3E7CC" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F3E7CC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.48" r="0.75">
      <stop offset="0.55" stop-color="#1C1714" stop-opacity="0"/>
      <stop offset="1" stop-color="#1C1714" stop-opacity="0.8"/>
    </radialGradient>
  </defs>

  <rect width="300" height="400" fill="url(#desk)"/>
  <g stroke="#4E3A28" stroke-width="1.2" opacity="0.6" fill="none">
    <path d="M0 70 C80 66 200 74 300 68"/>
    <path d="M0 170 C90 176 210 166 300 172"/>
    <path d="M0 280 C70 274 220 284 300 278"/>
  </g>
  <rect width="300" height="400" fill="url(#lamp)"/>

  <!-- Deri çalışma altlığı -->
  <rect x="34" y="70" width="190" height="180" rx="6" fill="#2F3A33"/>

  <!-- Söküklü kol saati: kasa, kadran, kayış -->
  <rect x="98" y="88" width="22" height="40" rx="4" fill="#3B2C20"/>
  <rect x="98" y="168" width="22" height="40" rx="4" fill="#3B2C20"/>
  <circle cx="109" cy="148" r="26" fill="#B9AE9A" stroke="#6E655B" stroke-width="3"/>
  <circle cx="109" cy="148" r="19" fill="#E9DFC9"/>
  <path d="M109 148 V134 M109 148 L118 152" stroke="#1C1714" stroke-width="1.4" stroke-linecap="round"/>
  <!-- çarklar -->
  <g fill="#C9A34E" stroke="#7A5F30" stroke-width="0.8">
    <circle cx="170" cy="104" r="10"/>
    <circle cx="186" cy="124" r="6"/>
    <circle cx="160" cy="132" r="5"/>
    <circle cx="190" cy="176" r="8"/>
  </g>
  <g fill="#2F3A33">
    <circle cx="170" cy="104" r="3"/>
    <circle cx="190" cy="176" r="2.4"/>
  </g>
  <circle cx="60" cy="214" r="3" fill="#B9AE9A"/>
  <circle cx="72" cy="226" r="2" fill="#B9AE9A"/>
  <circle cx="160" cy="220" r="2.4" fill="#B9AE9A"/>

  <!-- Cımbız -->
  <path d="M52 96 L86 132 M56 92 L88 128" stroke="#B9AE9A" stroke-width="2" stroke-linecap="round"/>

  <!-- Saatçi büyüteci (göz lupu) -->
  <path d="M232 92 h26 l-4 34 h-18 z" fill="#1C1714"/>
  <ellipse cx="245" cy="126" rx="9" ry="3" fill="#6E8C8E" opacity="0.8"/>

  <!-- Fotoğraf makinesi -->
  <g transform="rotate(-8 222 300)">
    <rect x="176" y="276" width="92" height="56" rx="6" fill="#1C1714"/>
    <rect x="176" y="276" width="92" height="14" rx="4" fill="#2E2822"/>
    <rect x="186" y="266" width="22" height="12" rx="2" fill="#2E2822"/>
