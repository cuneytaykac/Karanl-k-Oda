<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Yanlış Adam · Rulo 1 · Kare 10 · "Göle"
       Kapıda Haluk'un arabası; arka camdan oltalar uzanıyor. Haluk sivil, sigarasını yakıyor.
       İnceleme: oltalar, merkez (210, 170), yarıçap 38 → ipucu -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D6C6A6"/>
      <stop offset="1" stop-color="#C2B08E"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E8270"/>
      <stop offset="1" stop-color="#6A5F50"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.48" r="0.75">
      <stop offset="0.55" stop-color="#1C1714" stop-opacity="0"/>
      <stop offset="1" stop-color="#1C1714" stop-opacity="0.8"/>
    </radialGradient>
  </defs>

  <rect width="300" height="400" fill="url(#sky)"/>
  <!-- karşı cephe -->
  <rect y="40" width="300" height="190" fill="#AE9B7B"/>
  <g fill="#8C7A5E"><rect x="20" y="70" width="40" height="56"/><rect x="90" y="70" width="40" height="56"/><rect x="230" y="70" width="40" height="56"/></g>
  <rect y="230" width="300" height="170" fill="#6E5E47"/>
  <path d="M0 330 H300" stroke="#5B4C39" stroke-width="3"/>

  <!-- araba (yandan) -->
  <path d="M20 300 C24 270 50 262 80 258 L110 226 C120 214 200 214 216 226 L248 258 C272 262 284 274 286 300 V320 H20 Z" fill="url(#car)"/>
  <path d="M116 232 L94 258 H156 V230 C140 228 124 228 116 232 Z" fill="#3E4A4C"/>
  <path d="M164 230 V258 H236 L212 232 C200 228 180 228 164 230 Z" fill="#3E4A4C"/>
  <path d="M20 290 H286" stroke="#4E453A" stroke-width="1.5"/>
  <circle cx="74" cy="322" r="22" fill="#1C1714"/>
  <circle cx="232" cy="322" r="22" fill="#1C1714"/>
  <circle cx="74" cy="322" r="8" fill="#8E8270"/>
  <circle cx="232" cy="322" r="8" fill="#8E8270"/>
  <rect x="268" y="276" width="14" height="8" rx="2" fill="#E9DFC9"/>

  <!-- arka camdan çıkan oltalar -->
  <g stroke="#2A221B" stroke-linecap="round">
    <path d="M196 250 L240 120" stroke-width="2.6"/>
    <path d="M204 252 L256 136" stroke-width="2.2"/>
    <path d="M212 254 L222 104" stroke-width="2"/>
  </g>
  <circle cx="216" cy="196" r="5" fill="#8E7E6A" stroke="#2A221B" stroke-width="1.2"/>
  <path d="M240 120 Q252 160 248 200" fill="none" stroke="#2A221B" stroke-width="0.6"/>

  <!-- Haluk: sivil, arabaya yaslanmış -->
  <path d="M30 300 C30 246 40 214 60 206 C82 214 90 246 90 300 Z" fill="#4A4236"/>
  <circle cx="60" cy="188" r="16" fill="#C7A98A"/>
  <path d="M44 184 C46 168 76 168 76 184 C70 176 50 176 44 184 Z" fill="#3B3128"/>
  <path d="M74 194 L84 192" stroke="#E9DFC9" stroke-width="2" stroke-linecap="round"/>
  <circle cx="85" cy="192" r="1.6" fill="#E8893A"/>

  <rect width="300" height="400" fill="#8A5A2B" opacity="0.08"/>
  <rect width="300" height="400" fill="url(#vignette)"/>
  <text x="282" y="392" text-anchor="end" font-family="JetBrainsMono" font-size="13" font-weight="700" fill="#E8893A" opacity="0.92">'89 3 3</text>
</svg>
