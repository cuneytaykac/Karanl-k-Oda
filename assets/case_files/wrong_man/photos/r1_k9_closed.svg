<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Yanlış Adam · Rulo 1 · Kare 9 · "Kapalı"
       Necati kapıya "KAPALI" levhasını asıyor. Kapının üstündeki saat 11:05.
       İnceleme: kapı üstü saat, merkez (150, 66), yarıçap 28 → zaman: 11:05 -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7E6C52"/>
      <stop offset="1" stop-color="#5E4E3A"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D6C6A6"/>
      <stop offset="1" stop-color="#B8A585"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.48" r="0.75">
      <stop offset="0.55" stop-color="#1C1714" stop-opacity="0"/>
      <stop offset="1" stop-color="#1C1714" stop-opacity="0.8"/>
    </radialGradient>
  </defs>

  <rect width="300" height="400" fill="url(#wall)"/>
  <!-- kapı çerçevesi -->
  <rect x="70" y="100" width="160" height="300" fill="#3A2F24"/>
  <rect x="82" y="112" width="136" height="170" fill="url(#glass)"/>
  <rect x="82" y="290" width="136" height="110" fill="#4A3B2E"/>
  <!-- dışarıda: Haluk'un arabasının silueti -->
  <path d="M90 250 C100 226 130 220 160 222 C196 222 206 236 214 252 V276 H90 Z" fill="#8E7C60"/>
  <rect x="112" y="230" width="40" height="18" rx="3" fill="#B9AE9A"/>
  <circle cx="110" cy="276" r="9" fill="#2A221B"/>
  <circle cx="196" cy="276" r="9" fill="#2A221B"/>

  <!-- KAPALI levhası -->
  <path d="M130 140 L150 124 L170 140" fill="none" stroke="#2A221B" stroke-width="1.4"/>
  <rect x="114" y="140" width="72" height="30" rx="2" fill="#EFE5D2" stroke="#2A221B" stroke-width="1.4"/>
  <text x="150" y="160" text-anchor="middle" font-family="Poppins" font-size="12" font-weight="600" fill="#A8362A">KAPALI</text>
  <!-- Necati'nin eli -->
  <path d="M186 160 C200 158 214 164 222 176" stroke="#5A4A3A" stroke-width="14" stroke-linecap="round" fill="none"/>
  <ellipse cx="184" cy="158" rx="9" ry="7" fill="#C7A98A"/>

  <!-- kapı üstü saat 11:05 -->
  <rect x="122" y="40" width="56" height="52" rx="6" fill="#4A3426"/>
  <circle cx="150" cy="66" r="20" fill="#EFE5D2" stroke="#2A1F17" stroke-width="3"/>
  <g stroke="#6E655B" stroke-width="1"><path d="M150 48 V52 M168 66 H164 M150 84 V80 M132 66 H136"/></g>
  <path d="M150 66 L144.9 56.2" stroke="#1C1714" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M150 66 L158.8 50.8" stroke="#1C1714" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="150" cy="66" r="1.6" fill="#A8362A"/>

  <rect width="300" height="400" fill="#8A5A2B" opacity="0.08"/>
  <rect width="300" height="400" fill="url(#vignette)"/>
  <text x="282" y="392" text-anchor="end" font-family="JetBrainsMono" font-size="13" font-weight="700" fill="#E8893A" opacity="0.92">'89 3 3</text>
</svg>
