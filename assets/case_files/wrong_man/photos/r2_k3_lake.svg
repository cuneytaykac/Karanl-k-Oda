<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Karanlık Oda · Yanlış Adam · Rulo 2 · Kare 3 · "Göl kıyısı, 3 Mart 1989"
       İnceleme noktası: kol saati, merkez (205, 262), yarıçap ~9. Saat 12:30. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9B593"/>
      <stop offset="0.6" stop-color="#DCCBA8"/>
      <stop offset="1" stop-color="#E6D7B6"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A79676"/>
      <stop offset="1" stop-color="#6E604B"/>
    </linearGradient>
    <linearGradient id="shore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B4C39"/>
      <stop offset="1" stop-color="#3A2F24"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.48" r="0.75">
      <stop offset="0.55" stop-color="#1C1714" stop-opacity="0"/>
      <stop offset="1" stop-color="#1C1714" stop-opacity="0.75"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F3E7CC" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F3E7CC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Gökyüzü ve güneş pusu -->
  <rect width="300" height="400" fill="url(#sky)"/>
  <circle cx="236" cy="70" r="70" fill="url(#sun)"/>

  <!-- Uzak tepeler -->
  <path d="M0 150 C40 128 70 132 105 142 C140 152 165 120 205 124 C240 128 265 140 300 132 L300 175 L0 175 Z" fill="#9C8A6A" opacity="0.75"/>
  <path d="M0 165 C50 150 95 160 140 158 C190 156 230 146 300 156 L300 180 L0 180 Z" fill="#857356"/>

  <!-- Göl -->
  <rect y="176" width="300" height="124" fill="url(#lake)"/>
  <g stroke="#CDBE9E" stroke-linecap="round" opacity="0.55">
    <path d="M20 192 H80" stroke-width="1.5"/>
    <path d="M130 188 H210" stroke-width="1.2"/>
    <path d="M226 200 H282" stroke-width="1.5"/>
    <path d="M40 214 H120" stroke-width="1.2"/>
    <path d="M160 222 H230" stroke-width="1"/>
    <path d="M12 238 H66" stroke-width="1"/>
    <path d="M240 244 H292" stroke-width="1"/>
  </g>
  <!-- Güneş yansıması -->
  <g stroke="#EFE3C6" stroke-linecap="round" opacity="0.7">
    <path d="M222 184 H250" stroke-width="2"/>
    <path d="M226 192 H246" stroke-width="1.6"/>
    <path d="M229 200 H243" stroke-width="1.3"/>
  </g>

  <!-- Olta ipi (göle uzanıyor) -->
  <path d="M232 158 Q 120 150 70 214" fill="none" stroke="#2A221B" stroke-width="0.8"/>
  <circle cx="70" cy="215" r="2.6" fill="#A8362A"/>
  <path d="M64 218 H76" stroke="#CDBE9E" stroke-width="0.8" opacity="0.8"/>

  <!-- Kıyı -->
  <path d="M0 292 C60 282 120 288 170 284 C220 280 260 286 300 280 L300 400 L0 400 Z" fill="url(#shore)"/>

  <!-- Sazlar -->
  <g stroke="#2E261D" stroke-linecap="round" fill="none">
    <path d="M18 300 Q 16 270 24 248" stroke-width="2"/>
    <path d="M26 302 Q 28 276 20 258" stroke-width="1.6"/>
    <path d="M34 300 Q 38 280 44 266" stroke-width="1.8"/>
    <path d="M278 296 Q 282 266 274 246" stroke-width="2"/>
    <path d="M286 298 Q 286 276 294 262" stroke-width="1.6"/>
  </g>

  <!-- Balık kovası -->
  <g>
    <path d="M84 322 L90 356 H118 L124 322 Z" fill="#6B6255"/>
    <ellipse cx="104" cy="322" rx="20" ry="5" fill="#4A4238"/>
    <path d="M86 322 Q 104 300 122 322" fill="none" stroke="#2A221B" stroke-width="1.4"/>
    <path d="M96 320 q 6 -8 14 -2" fill="#B9AE9A"/>
    <path d="M104 319 l 6 -5 l 0 9 z" fill="#B9AE9A"/>
  </g>

  <!-- Katlanır tabure -->
  <g stroke="#2A221B" stroke-width="3" stroke-linecap="round">
    <path d="M168 352 L196 314"/>
    <path d="M196 352 L168 314"/>
  </g>
  <rect x="160" y="308" width="44" height="7" rx="2" fill="#4A3B2E"/>

  <!-- Adam: yandan, oturuyor (Necati) -->
  <!-- bacaklar -->
  <path d="M176 306 L150 312 L146 352" fill="none" stroke="#2F2A24" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M188 306 L162 316 L160 354" fill="none" stroke="#38322B" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="142" cy="356" rx="9" ry="4.5" fill="#1C1714"/>
  <ellipse cx="156" cy="358" rx="9" ry="4.5" fill="#1C1714"/>
  <!-- gövde (ceket) -->
  <path d="M170 236 C186 228 202 234 206 250 L210 304 L168 308 C164 282 162 256 170 236 Z" fill="#5A4A3A"/>
  <path d="M188 240 L192 302" stroke="#46392C" stroke-width="1.4"/>
  <!-- baş ve kasket -->
  <circle cx="186" cy="218" r="14" fill="#C7A98A"/>
  <path d="M171 214 C172 200 200 198 203 212 L206 214 L171 216 Z" fill="#3B3128"/>
  <path d="M200 212 L214 214 L203 217 Z" fill="#2E261F"/>
  <path d="M175 220 Q 178 230 188 232" fill="none" stroke="#A88A6C" stroke-width="1.5"/>
  <!-- arka kol (oltayı tutuyor) -->
  <path d="M176 248 L198 270 L218 262" fill="none" stroke="#4E4032" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- olta kamışı -->
  <path d="M214 270 L232 158" stroke="#3A2F24" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M214 270 L209 296" stroke="#2A221B" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="211" cy="282" r="3.6" fill="#8E7E6A" stroke="#2A221B" stroke-width="1"/>
  <!-- ön kol: bilek ve SAAT -->
  <path d="M190 246 L194 272 L210 266" fill="none" stroke="#5F4F3E" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="214" cy="264" r="5" fill="#C7A98A"/>
  <!-- kayış -->
  <rect x="199" y="256" width="9" height="15" rx="2" fill="#2A1F17" transform="rotate(-18 203.5 263.5)"/>
  <!-- kadran -->
  <circle cx="205" cy="262" r="5.2" fill="#E9DFC9" stroke="#1C1714" stroke-width="1.2"/>
  <path d="M205 257.6 V258.4 M209.4 262 H208.6 M205 266.4 V265.6 M200.6 262 H201.4" stroke="#6E655B" stroke-width="0.5"/>
  <!-- akrep: 12 ile 1 arası (12:30) · yelkovan: 6 (30) -->
  <path d="M205 262 L205.8 259.1" stroke="#1C1714" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M205 262 V266" stroke="#1C1714" stroke-width="0.75" stroke-linecap="round"/>
  <circle cx="205" cy="262" r="0.7" fill="#A8362A"/>

  <!-- Eski fotoğraf hissi: sıcak örtü ve kenar kararması -->
  <rect width="300" height="400" fill="#8A5A2B" opacity="0.08"/>
  <rect width="300" height="400" fill="url(#vignette)"/>
  <g stroke="#F6EEDD" stroke-linecap="round" opacity="0.18">
    <path d="M58 40 L60 70" stroke-width="0.6"/>
    <path d="M132 260 L133 286" stroke-width="0.5"/>
    <path d="M262 330 L259 372" stroke-width="0.6"/>
  </g>

  <!-- Tarih damgası -->
  <text x="282" y="386" text-anchor="end" font-family="JetBrainsMono" font-size="13" font-weight="700" fill="#E8893A" opacity="0.92">'89 3 3</text>
</svg>
