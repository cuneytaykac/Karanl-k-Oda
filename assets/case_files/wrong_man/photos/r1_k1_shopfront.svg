<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Yanlış Adam · Rulo 1 · Kare 1 · "Saatçi dükkânı", Şubat 1989
       İnceleme: tabela, merkez (150, 92), yarıçap 44 → kişi: Necati Aydın -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B8A585"/>
      <stop offset="1" stop-color="#9C8A6C"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A4136"/>
      <stop offset="0.5" stop-color="#2E2822"/>
      <stop offset="1" stop-color="#3C342B"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.48" r="0.75">
      <stop offset="0.55" stop-color="#1C1714" stop-opacity="0"/>
      <stop offset="1" stop-color="#1C1714" stop-opacity="0.75"/>
    </radialGradient>
  </defs>

  <!-- Bina cephesi -->
  <rect width="300" height="400" fill="url(#wall)"/>
  <g stroke="#8E7C60" stroke-width="1" opacity="0.5">
    <path d="M0 40 H300 M0 330 H300"/>
    <path d="M40 0 V40 M120 0 V40 M200 0 V40 M270 0 V40"/>
  </g>

  <!-- Tabela -->
  <rect x="40" y="62" width="220" height="60" rx="3" fill="#2A221B"/>
  <rect x="46" y="68" width="208" height="48" rx="2" fill="none" stroke="#C9A34E" stroke-width="1.2" opacity="0.7"/>
  <text x="150" y="94" text-anchor="middle" font-family="Lora" font-size="22" font-weight="600" fill="#E9DCC2" letter-spacing="3">N. AYDIN</text>
  <text x="150" y="110" text-anchor="middle" font-family="Poppins" font-size="9" fill="#C9A34E" letter-spacing="4">SAAT TAMİRİ</text>

  <!-- Tente -->
  <path d="M30 128 H270 L282 150 H18 Z" fill="#6E5A44"/>
  <g fill="#8A7458">
    <path d="M30 128 H60 L56 150 H18 Z"/>
    <path d="M90 128 H120 L122 150 H86 Z"/>
    <path d="M150 128 H180 L188 150 H152 Z"/>
    <path d="M210 128 H240 L252 150 H218 Z"/>
  </g>

  <!-- Vitrin -->
  <rect x="26" y="158" width="160" height="150" fill="#3A2F24"/>
  <rect x="32" y="164" width="148" height="138" fill="url(#glass)"/>
  <!-- vitrindeki saatler -->
  <g fill="none" stroke="#B9AE9A" stroke-width="1.6">
    <circle cx="66" cy="200" r="18"/>
    <circle cx="120" cy="196" r="13"/>
    <circle cx="156" cy="210" r="15"/>
    <circle cx="80" cy="256" r="12"/>
    <circle cx="132" cy="258" r="20"/>
  </g>
  <g stroke="#B9AE9A" stroke-width="1.2" stroke-linecap="round">
    <path d="M66 200 V188 M66 200 L74 205"/>
    <path d="M120 196 V187 M120 196 L126 199"/>
    <path d="M156 210 V199 M156 210 L163 214"/>
    <path d="M80 256 V247 M80 256 L86 259"/>
    <path d="M132 258 V244 M132 258 L142 263"/>
  </g>
  <!-- cam yansıması -->
  <path d="M40 300 L110 166 H128 L58 300 Z" fill="#F3E7CC" opacity="0.08"/>

  <!-- Kapı -->
  <rect x="200" y="158" width="76" height="172" fill="#3A2F24"/>
  <rect x="207" y="166" width="62" height="78" fill="url(#glass)"/>
  <rect x="207" y="252" width="62" height="70" fill="#4A3B2E"/>
  <circle cx="260" cy="262" r="3" fill="#C9A34E"/>
  <rect x="216" y="190" width="44" height="18" rx="2" fill="#E9DCC2"/>
  <text x="238" y="203" text-anchor="middle" font-family="Poppins" font-size="9" font-weight="600" fill="#2A221B">AÇIK</text>

  <!-- Kaldırım -->
  <rect y="330" width="300" height="70" fill="#5B4C39"/>
  <g stroke="#463A2C" stroke-width="1.2">
    <path d="M0 352 H300 M0 376 H300"/>
    <path d="M30 330 V352 M90 330 V352 M150 330 V352 M210 330 V352 M270 330 V352"/>
    <path d="M60 352 V376 M120 352 V376 M180 352 V376 M240 352 V376"/>
  </g>

  <rect width="300" height="400" fill="#8A5A2B" opacity="0.08"/>
  <rect width="300" height="400" fill="url(#vignette)"/>
  <text x="282" y="392" text-anchor="end" font-family="JetBrainsMono" font-size="13" font-weight="700" fill="#E8893A" opacity="0.92">'89 2 24</text>
</svg>
