<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Yanlış Adam · Rulo 1 · Kare 6 · "Karşı dükkân"
       Necati'nin vitrininden karşıya çekilmiş: Rıza Usta'nın kuyumcusu.
       İnceleme 1: vitrindeki yeni levha "SİGORTALIDIR", merkez (98, 252), yarıçap 32 → ipucu (yanlış iz)
       İnceleme 2: kapıdaki Rıza Usta, merkez (226, 248), yarıçap 34 → kişi: Rıza Usta -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A89676"/>
      <stop offset="1" stop-color="#8C7A5E"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A4136"/>
      <stop offset="1" stop-color="#2E2822"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.48" r="0.75">
      <stop offset="0.55" stop-color="#1C1714" stop-opacity="0"/>
      <stop offset="1" stop-color="#1C1714" stop-opacity="0.8"/>
    </radialGradient>
  </defs>

  <rect width="300" height="400" fill="url(#wall)"/>
  <!-- Necati'nin camının kenarı (ön planda, bulanık) -->
  <rect x="0" y="0" width="14" height="400" fill="#2A221B" opacity="0.8"/>
  <rect x="0" y="0" width="300" height="14" fill="#2A221B" opacity="0.8"/>

  <!-- Tabela -->
  <rect x="34" y="56" width="232" height="46" rx="3" fill="#E9DCC2"/>
  <text x="150" y="86" text-anchor="middle" font-family="Lora" font-size="19" font-weight="600" fill="#2A221B" letter-spacing="2">RIZA KUYUMCULUK</text>

  <!-- Vitrin -->
  <rect x="30" y="122" width="140" height="196" fill="#3A2F24"/>
  <rect x="36" y="128" width="128" height="184" fill="url(#glass)"/>
  <!-- vitrinde mücevher -->
  <g fill="none" stroke="#C9A34E" stroke-width="1.6">
    <circle cx="70" cy="160" r="8"/>
    <circle cx="100" cy="164" r="6"/>
    <path d="M120 150 Q134 176 148 150"/>
    <path d="M52 188 Q100 214 148 188"/>
  </g>
  <g fill="#C9A34E">
    <circle cx="134" cy="165" r="3"/>
    <circle cx="100" cy="200" r="3"/>
  </g>
  <!-- YENİ LEVHA -->
  <rect x="64" y="234" width="68" height="36" rx="2" fill="#EFE5D2" stroke="#A8362A" stroke-width="2"/>
  <text x="98" y="250" text-anchor="middle" font-family="Poppins" font-size="7.5" font-weight="600" fill="#A8362A">SİGORTALIDIR</text>
  <text x="98" y="262" text-anchor="middle" font-family="Poppins" font-size="5.5" fill="#2A221B">EMNİYET SİGORTA A.Ş.</text>

  <!-- Kapı ve Rıza Usta -->
  <rect x="186" y="122" width="84" height="196" fill="#3A2F24"/>
  <rect x="192" y="128" width="72" height="190" fill="#211B16"/>
  <!-- Rıza: yaşlıca, kel, yelekli, kollar kavuşturulmuş -->
  <path d="M196 318 C198 274 208 254 228 250 C248 254 258 274 260 318 Z" fill="#5A4A3A"/>
  <path d="M214 258 L228 300 L242 258" fill="#E2D6BC" opacity="0.8"/>
  <path d="M202 290 H254" stroke="#4A3B2E" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="228" cy="226" rx="20" ry="24" fill="#C7A98A"/>
  <path d="M208 222 C208 214 212 210 216 210 M248 222 C248 214 244 210 240 210" stroke="#B9AE9A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M216 240 Q228 236 240 240" stroke="#B9AE9A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M218 224 h6 M232 224 h6" stroke="#3B2E24" stroke-width="2" stroke-linecap="round"/>

  <!-- Kaldırım -->
  <rect y="318" width="300" height="82" fill="#5B4C39"/>
  <g stroke="#463A2C" stroke-width="1.2">
    <path d="M0 342 H300 M0 368 H300"/>
    <path d="M40 318 V342 M110 318 V342 M180 318 V342 M250 318 V342"/>
  </g>

  <rect width="300" height="400" fill="#8A5A2B" opacity="0.08"/>
  <rect width="300" height="400" fill="url(#vignette)"/>
  <text x="282" y="392" text-anchor="end" font-family="JetBrainsMono" font-size="13" font-weight="700" fill="#E8893A" opacity="0.92">'89 2 25</text>
</svg>
