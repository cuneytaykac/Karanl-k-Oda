<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Yanlış Adam · Rulo 1 · Kare 4 · "Çırak"
       Cem (17) tezgâhta saat söküyor, kameraya gülümsüyor.
       İnceleme: Cem'in yüzü, merkez (150, 150), yarıçap 36 → kişi: Cem Demir -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7E6C52"/>
      <stop offset="1" stop-color="#5E4E3A"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#F3E7CC" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#F3E7CC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.48" r="0.75">
      <stop offset="0.55" stop-color="#1C1714" stop-opacity="0"/>
      <stop offset="1" stop-color="#1C1714" stop-opacity="0.8"/>
    </radialGradient>
  </defs>

  <rect width="300" height="400" fill="url(#bg)"/>
  <rect width="300" height="400" fill="url(#lamp)"/>
  <!-- arkada raf ve saatler -->
  <rect x="0" y="70" width="300" height="6" fill="#4A3B2E"/>
  <g fill="#E2D6BC" stroke="#3B3128" stroke-width="2">
    <circle cx="40" cy="52" r="14"/>
    <circle cx="262" cy="50" r="16"/>
  </g>

  <!-- Gövde, önlük -->
  <path d="M80 400 C82 300 100 240 150 232 C200 240 218 300 220 400 Z" fill="#4A5248"/>
  <path d="M120 250 L180 250 L188 400 H112 Z" fill="#6E7566"/>
  <path d="M120 250 L132 236 M180 250 L168 236" stroke="#3A4038" stroke-width="3"/>
  <rect x="134" y="300" width="32" height="22" rx="2" fill="#5E6558"/>
  <!-- boyun ve baş -->
  <rect x="140" y="196" width="20" height="40" fill="#B8977A"/>
  <ellipse cx="150" cy="152" rx="34" ry="42" fill="#C7A98A"/>
  <!-- kıvırcık saç -->
  <g fill="#2E261F">
    <circle cx="124" cy="120" r="14"/>
    <circle cx="140" cy="108" r="15"/>
    <circle cx="160" cy="106" r="15"/>
    <circle cx="176" cy="118" r="13"/>
    <circle cx="118" cy="140" r="9"/>
    <circle cx="183" cy="138" r="8"/>
  </g>
  <!-- yüz -->
  <path d="M134 150 q6 -5 12 0 M156 150 q6 -5 12 0" fill="none" stroke="#3B2E24" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M136 176 Q150 190 166 176" fill="none" stroke="#7A4A3A" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M150 156 L147 168 L152 169" fill="none" stroke="#A88A6C" stroke-width="1.6"/>
  <!-- ellerde cımbız ve saat -->
  <rect x="50" y="330" width="200" height="70" fill="#5A442F"/>
  <circle cx="112" cy="318" r="12" fill="#C7A98A"/>
  <circle cx="190" cy="318" r="12" fill="#C7A98A"/>
  <circle cx="150" cy="336" r="16" fill="#E9DFC9" stroke="#6E655B" stroke-width="3"/>
  <path d="M196 312 L160 334" stroke="#B9AE9A" stroke-width="2.4" stroke-linecap="round"/>

  <rect width="300" height="400" fill="#8A5A2B" opacity="0.08"/>
  <rect width="300" height="400" fill="url(#vignette)"/>
  <text x="282" y="392" text-anchor="end" font-family="JetBrainsMono" font-size="13" font-weight="700" fill="#E8893A" opacity="0.92">'89 2 25</text>
</svg>
